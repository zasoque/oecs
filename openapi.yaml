openapi: 3.1.0
info:
  title: OECS API
  version: 1.0.0-draft
  description: |
    API for a graph of observed constructed-language expressions. IDs identify
    records, never predefined meanings. All timestamps are RFC 3339 UTC.
servers:
  - url: /api/v1
paths:
  /languages:
    get:
      summary: List languages
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Cursor'}]
      responses: {'200': {$ref: '#/components/responses/LanguagePage'}}
    post:
      summary: Create a language
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LanguageInput'}}}}
      responses: {'201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Language'}}}}, '409': {$ref: '#/components/responses/Conflict'}}
  /languages/{languageId}:
    parameters: [{$ref: '#/components/parameters/LanguageId'}]
    get: {summary: Get a language, responses: {'200': {$ref: '#/components/responses/Language'}, '404': {$ref: '#/components/responses/NotFound'}}}
    patch:
      summary: Update language metadata (not expression data)
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LanguagePatch'}}}}
      responses: {'200': {$ref: '#/components/responses/Language'}, '404': {$ref: '#/components/responses/NotFound'}}
  /languages/{languageId}/versions:
    parameters: [{$ref: '#/components/parameters/LanguageId'}]
    get: {summary: List normative versions, responses: {'200': {$ref: '#/components/responses/VersionList'}}}
    post:
      summary: Record a language version
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LanguageVersionInput'}}}}
      responses: {'201': {$ref: '#/components/responses/LanguageVersion'}}
  /expressions:
    get:
      summary: Search expression nodes by current revision text
      parameters:
        - {name: language_id, in: query, schema: {$ref: '#/components/schemas/Uuid'}}
        - {name: text, in: query, description: Normalized-text search term, schema: {type: string}}
        - {name: type, in: query, schema: {$ref: '#/components/schemas/ExpressionType'}}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses: {'200': {$ref: '#/components/responses/ExpressionPage'}}
    post:
      summary: Create an expression node and its first revision
      description: The initial_revision is immutable after creation; later edits use the revisions endpoint.
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ExpressionCreate'}}}}
      responses: {'201': {$ref: '#/components/responses/Expression'}, '422': {$ref: '#/components/responses/ValidationError'}}
  /expressions/{expressionId}:
    parameters: [{$ref: '#/components/parameters/ExpressionId'}]
    get: {summary: Get node and current revision, responses: {'200': {$ref: '#/components/responses/Expression'}, '404': {$ref: '#/components/responses/NotFound'}}}
  /expressions/{expressionId}/revisions:
    parameters: [{$ref: '#/components/parameters/ExpressionId'}]
    get: {summary: List complete expression history, responses: {'200': {$ref: '#/components/responses/RevisionList'}}}
    post:
      summary: Append a new expression revision
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ExpressionRevisionInput'}}}}
      responses: {'201': {$ref: '#/components/responses/ExpressionRevision'}, '404': {$ref: '#/components/responses/NotFound'}}
  /relations:
    get:
      summary: List graph edges
      parameters:
        - {name: expression_id, in: query, description: Matches either edge end, schema: {$ref: '#/components/schemas/Uuid'}}
        - {name: relation_type, in: query, schema: {type: string}}
        - {name: direction, in: query, schema: {type: string, enum: [incoming, outgoing, both], default: both}}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses: {'200': {$ref: '#/components/responses/RelationPage'}}
    post:
      summary: Create a relation edge and its first evidence revision
      description: Source and target may form cycles. The API validates symmetry against the configured relation type.
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RelationCreate'}}}}
      responses: {'201': {$ref: '#/components/responses/Relation'}, '422': {$ref: '#/components/responses/ValidationError'}}
  /relations/{relationId}/revisions:
    parameters: [{$ref: '#/components/parameters/RelationId'}]
    get: {summary: List edge evidence/history, responses: {'200': {$ref: '#/components/responses/RelationRevisionList'}}}
    post:
      summary: Append relation evidence or assessment
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RelationRevisionInput'}}}}
      responses: {'201': {$ref: '#/components/responses/RelationRevision'}}
  /expression-graph:
    get:
      summary: Traverse the graph around an expression
      parameters:
        - {name: expression_id, in: query, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
        - {name: depth, in: query, schema: {type: integer, minimum: 1, maximum: 4, default: 1}}
        - {name: relation_type, in: query, schema: {type: string}}
      responses: {'200': {description: Nodes and edges, content: {application/json: {schema: {$ref: '#/components/schemas/Graph'}}}}}
  /discussions:
    get:
      summary: List discussions for a target
      parameters:
        - {name: target_type, in: query, required: true, schema: {$ref: '#/components/schemas/DiscussionTargetType'}}
        - {name: target_id, in: query, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
      responses: {'200': {$ref: '#/components/responses/DiscussionList'}}
    post:
      summary: Open a discussion
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DiscussionInput'}}}}
      responses: {'201': {$ref: '#/components/responses/Discussion'}}
  /discussions/{discussionId}/comments:
    parameters: [{$ref: '#/components/parameters/DiscussionId'}]
    post:
      summary: Add a preserved discussion comment
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [body], properties: {body: {type: string, minLength: 1}}}}}}
      responses: {'201': {description: Created}}
  /discussions/{discussionId}:
    parameters: [{$ref: '#/components/parameters/DiscussionId'}]
    patch:
      summary: Resolve or close a discussion
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [status], properties: {status: {type: string, enum: [open, resolved, closed]}, resolution: {type: string, enum: [accepted, rejected, partially_accepted, no_change]}}}}}}
      responses: {'200': {$ref: '#/components/responses/Discussion'}}
components:
  securitySchemes: {bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}}
  parameters:
    LanguageId: {name: languageId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
    ExpressionId: {name: expressionId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
    RelationId: {name: relationId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
    DiscussionId: {name: discussionId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
    Cursor: {name: cursor, in: query, schema: {type: string}}
  schemas:
    Uuid: {type: string, format: uuid}
    ExpressionType: {type: string, enum: [word, compound, phrase, idiom, clause, sentence, other]}
    Similarity: {type: string, enum: [identical, very_similar, similar, partially_overlapping, related, different]}
    LanguageInput: {type: object, required: [identifier, name], properties: {identifier: {type: string}, name: {type: string}, native_name: {type: string}, description: {type: string}}}
    LanguagePatch: {type: object, properties: {name: {type: string}, native_name: {type: string}, description: {type: string}, status: {type: string, enum: [draft, active, archived]}}}
    Language: {allOf: [{$ref: '#/components/schemas/LanguageInput'}, {type: object, required: [id, created_at, updated_at], properties: {id: {$ref: '#/components/schemas/Uuid'}, created_at: {type: string, format: date-time}, updated_at: {type: string, format: date-time}}}]}
    LanguageVersionInput: {type: object, required: [version], properties: {version: {type: string}, valid_from: {type: string, format: date}, valid_until: {type: string, format: date}, temporal_certainty: {type: string, enum: [exact, approximate, before, after, unknown]}, description: {type: string}, grammar_source_id: {$ref: '#/components/schemas/Uuid'}, orthography_source_id: {$ref: '#/components/schemas/Uuid'}}}
    LanguageVersion: {allOf: [{$ref: '#/components/schemas/LanguageVersionInput'}, {type: object, properties: {id: {$ref: '#/components/schemas/Uuid'}, language_id: {$ref: '#/components/schemas/Uuid'}}}]}
    ExpressionRevisionInput: {type: object, required: [text, normalized_text], properties: {text: {type: string}, normalized_text: {type: string}, language_version_id: {$ref: '#/components/schemas/Uuid'}, usage_status: {type: string, enum: [standard, colloquial, dialect, archaic, obsolete, nonstandard, experimental, incorrect]}, valid_from: {type: string, format: date}, valid_until: {type: string, format: date}, temporal_certainty: {type: string, enum: [exact, approximate, before, after, unknown]}, source_id: {$ref: '#/components/schemas/Uuid'}, change_summary: {type: string}}}
    ExpressionCreate: {type: object, required: [language_id, expression_type, initial_revision], properties: {language_id: {$ref: '#/components/schemas/Uuid'}, expression_type: {$ref: '#/components/schemas/ExpressionType'}, script: {type: string}, initial_revision: {$ref: '#/components/schemas/ExpressionRevisionInput'}}}
    ExpressionRevision: {allOf: [{$ref: '#/components/schemas/ExpressionRevisionInput'}, {type: object, properties: {id: {$ref: '#/components/schemas/Uuid'}, expression_id: {$ref: '#/components/schemas/Uuid'}, revision_number: {type: integer}}}]}
    Expression: {type: object, properties: {id: {$ref: '#/components/schemas/Uuid'}, language_id: {$ref: '#/components/schemas/Uuid'}, expression_type: {$ref: '#/components/schemas/ExpressionType'}, script: {type: string}, current_revision: {$ref: '#/components/schemas/ExpressionRevision'}}}
    RelationRevisionInput: {type: object, properties: {status: {type: string, enum: [proposed, accepted, rejected, superseded]}, confidence: {type: number, minimum: 0, maximum: 1}, semantic_similarity: {$ref: '#/components/schemas/Similarity'}, pragmatic_similarity: {$ref: '#/components/schemas/Similarity'}, register_similarity: {$ref: '#/components/schemas/Similarity'}, structural_similarity: {$ref: '#/components/schemas/Similarity'}, notes: {type: string}, source_id: {$ref: '#/components/schemas/Uuid'}}}
    RelationCreate: {type: object, required: [source_expression_id, target_expression_id, relation_type_code, initial_revision], properties: {source_expression_id: {$ref: '#/components/schemas/Uuid'}, target_expression_id: {$ref: '#/components/schemas/Uuid'}, relation_type_code: {type: string}, direction: {type: string, enum: [directed, symmetric]}, language_version_id: {$ref: '#/components/schemas/Uuid'}, initial_revision: {$ref: '#/components/schemas/RelationRevisionInput'}}}
    RelationRevision: {allOf: [{$ref: '#/components/schemas/RelationRevisionInput'}, {type: object, properties: {id: {$ref: '#/components/schemas/Uuid'}, relation_id: {$ref: '#/components/schemas/Uuid'}, revision_number: {type: integer}}}]}
    Relation: {allOf: [{$ref: '#/components/schemas/RelationCreate'}, {type: object, properties: {id: {$ref: '#/components/schemas/Uuid'}, current_revision: {$ref: '#/components/schemas/RelationRevision'}}}]}
    Graph: {type: object, required: [nodes, edges], properties: {nodes: {type: array, items: {$ref: '#/components/schemas/Expression'}}, edges: {type: array, items: {$ref: '#/components/schemas/Relation'}}, truncated: {type: boolean}}}
    DiscussionTargetType: {type: string, enum: [language, language_version, expression, expression_revision, relation, relation_revision]}
    DiscussionInput: {type: object, required: [target_type, target_id, title], properties: {target_type: {$ref: '#/components/schemas/DiscussionTargetType'}, target_id: {$ref: '#/components/schemas/Uuid'}, title: {type: string}}}
    Discussion: {allOf: [{$ref: '#/components/schemas/DiscussionInput'}, {type: object, properties: {id: {$ref: '#/components/schemas/Uuid'}, status: {type: string}, resolution: {type: string}, created_at: {type: string, format: date-time}}}]}
    Error: {type: object, required: [code, message], properties: {code: {type: string}, message: {type: string}, details: {type: object}}}
  responses:
    Language: {description: Language, content: {application/json: {schema: {$ref: '#/components/schemas/Language'}}}}
    LanguagePage: {description: Paginated languages, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/Language'}}, next_cursor: {type: [string, 'null']}}}}}}
    LanguageVersion: {description: Created version, content: {application/json: {schema: {$ref: '#/components/schemas/LanguageVersion'}}}}
    VersionList: {description: Versions, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/LanguageVersion'}}}}}
    Expression: {description: Expression, content: {application/json: {schema: {$ref: '#/components/schemas/Expression'}}}}
    ExpressionPage: {description: Paginated expressions, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/Expression'}}, next_cursor: {type: [string, 'null']}}}}}}
    ExpressionRevision: {description: Created revision, content: {application/json: {schema: {$ref: '#/components/schemas/ExpressionRevision'}}}}
    RevisionList: {description: Revisions, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/ExpressionRevision'}}}}}
    Relation: {description: Relation, content: {application/json: {schema: {$ref: '#/components/schemas/Relation'}}}}
    RelationPage: {description: Paginated relations, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/Relation'}}, next_cursor: {type: [string, 'null']}}}}}}
    RelationRevision: {description: Created revision, content: {application/json: {schema: {$ref: '#/components/schemas/RelationRevision'}}}}
    RelationRevisionList: {description: Revisions, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/RelationRevision'}}}}}
    Discussion: {description: Discussion, content: {application/json: {schema: {$ref: '#/components/schemas/Discussion'}}}}
    DiscussionList: {description: Discussions, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Discussion'}}}}}
    NotFound: {description: Resource not found, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Conflict: {description: Duplicate or conflicting state, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    ValidationError: {description: Invalid input, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
